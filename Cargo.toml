[package]
name = "otel-bootstrap"
version = "2.13.0"
edition = "2024"
authors = ["Gregoire Salingue"]
description = "One-call OpenTelemetry bootstrap — traces + metrics with OTLP export"
license = "MIT"
repository = "https://github.com/brefwiz/otel-bootstrap"
homepage = "https://github.com/brefwiz/otel-bootstrap"
readme = "README.md"
keywords = ["opentelemetry", "otlp", "tracing", "observability", "axum"]
categories = ["development-tools::debugging", "development-tools::profiling"]
rust-version = "1.85"
publish = ["crates-io"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["grpc"]
grpc = ["opentelemetry-otlp/grpc-tonic"]
# mTLS for the gRPC transport. Implies grpc; pulls in tonic with TLS support.
# Callers supply PEM material via TelemetryBuilder::with_mtls(MtlsMaterial).
# v1: cert/key are read ONCE at init — pod must restart on SVID rotation.
# (Rotation watcher is a follow-up; not blocking initial mTLS rollout.)
grpc-mtls = ["grpc", "dep:tonic", "opentelemetry-otlp/tls", "opentelemetry-otlp/tls-roots"]
http = ["opentelemetry-otlp/http-proto", "opentelemetry-otlp/reqwest-client"]
integration-tests = []
testing = ["opentelemetry_sdk/testing"]
axum = ["dep:axum", "dep:tower"]
# Trace-context propagation for raw tonic gRPC clients/servers (services that
# don't go through an axum router). Independent of `grpc`, which is about the
# OTLP *exporter* transport, not app-level gRPC instrumentation.
tonic-tracing = ["dep:tonic", "dep:tower", "dep:http"]
profiling = []
# Temporary bridge pending native Rust OTLP profiles exporter (Tracks #40, ADR platform/0202)
profiling-bridge-pyroscope-rs = ["profiling", "dep:pyroscope"]
# Heap profiling via jemalloc. Requires the binary to set jemalloc as its
# global allocator (tikv-jemallocator with the `profiling` feature) and to run
# with prof:true,prof_active:true — neither of which this crate can arrange on
# a consumer's behalf, hence a separate flag rather than on by default.
profiling-memory-jemalloc = ["profiling-bridge-pyroscope-rs", "pyroscope/backend-jemalloc", "dep:jemalloc_pprof"]
# Builds the `heap-probe` binary and its tests. Heap profiling can only be
# validated in a process that installs jemalloc as its global allocator and has
# _RJEM_MALLOC_CONF set before main — neither is true of a `cargo test` binary,
# which is how two releases shipped broken profiling. Separate from the feature
# above so consumers never link an allocator they did not choose; CI runs
# --all-features, so the probe is exercised there.
profiling-memory-probe = ["profiling-memory-jemalloc", "dep:tikv-jemallocator"]

[dependencies]
opentelemetry = { version = "0.32", features = ["metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "logs", "rt-tokio"] }
# Already a hard runtime dependency via opentelemetry_sdk's `rt-tokio`: the
# metrics PeriodicReader needs a Tokio runtime to export at all. Declared
# explicitly so `runtime_metrics` can read Handle/RuntimeMetrics and spawn the
# scheduler probe without relying on a transitive feature staying enabled.
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
opentelemetry-otlp = { version = "0.32", features = ["metrics", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing = "0.1"
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
hostname = "0.4"
url = "2.5"
axum = { version = "=0.8", optional = true }
tower = { version = "0.5", optional = true }
# Used for ClientTlsConfig under grpc-mtls, and for Channel/Server under
# tonic-tracing. tls-roots gives a default webpki trust root; we override
# per-call with our own ca_certificate.
tonic = { version = "0.14", features = ["tls-native-roots"], optional = true }
http = { version = "1", optional = true }
pyroscope = { version = "2.1", optional = true, features = ["backend-pprof-rs"] }
# Same crate pyroscope's jemalloc backend uses, taken directly so sampling can
# be activated after startup. Arming it via prof_active:true segfaults before
# main on x86_64 musl; activating from Rust once the runtime is up does not.
jemalloc_pprof = { version = "0.9", features = ["symbolize"], optional = true }
# Only ever linked by the `heap-probe` binary (profiling-memory-probe).
tikv-jemallocator = { version = "0.7", features = ["profiling"], optional = true }

[[example]]
name = "basic_setup"
required-features = ["grpc"]

[[example]]
name = "shutdown_handling"
required-features = ["grpc"]

[[example]]
name = "custom_config"
required-features = ["grpc"]

[[example]]
name = "axum_span_enricher"
required-features = ["grpc", "axum"]

[[example]]
name = "telemetry_profiling"
required-features = ["profiling"]

[[example]]
name = "instrumented_port"
required-features = ["testing"]

[[example]]
name = "spanned"
required-features = ["testing"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde_yaml = "0.9"
opentelemetry = { version = "0.32", features = ["trace"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

# Real-process probe for heap profiling. Not shipped to consumers — gated behind
# profiling-memory-probe, which nothing but CI and local validation enables.
[[bin]]
name = "heap-probe"
required-features = ["profiling-memory-probe"]
